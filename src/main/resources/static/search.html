<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wikipedia Search</title>
    <link rel="stylesheet" href="/css/search.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<header class="main-header">
    <nav class="header-nav">
        <a href="/my-articles.html" class="header-link">My Articles</a>
        <a href="/categories.html" class="header-link">Categories</a>
        <a href="/search.html" class="header-link">Search</a>
        <a href="/statistics.html" class="header-link">Statistics</a>
        <a href="/docs/" class="header-link header-link-docs">User Guide</a>
    </nav>
</header>

<h1>🔍 Your Wikipedia Search Hub</h1>

<div class="search-container">
    <input
            type="text"
            id="searchInput"
            placeholder="Type keywords to search..."
            aria-label="Search Wikipedia">
    <button id="searchButton">Search</button>
</div>

<div class="results" id="results"></div>
<div class="pagination" id="pagination"></div>

<template id="articleTemplate">
    <div class="article">
        <div class="article-info">
            <h3 class="article-title">
                <a href="#" target="_blank"></a> 🔗
            </h3>
            <p class="article-snippet"></p>

            <div class="article-extra">
                <p><strong>Comments:</strong>
                    <span class="article-comments"></span>
                </p>
                <p><strong>Grade:</strong>
                    <span class="article-grade"></span>
                </p>
                <p><strong>Category:</strong>
                    <span class="article-category"></span>
                </p>
            </div>
        </div>

        <button class="article-action-button" disabled>
            Save
        </button>
    </div>
</template>

<div id="saveModal" class="modal hidden">
    <div class="modal-content">
        <h2>Save Article</h2>

        <label for="categorySelect">Category</label>
        <select id="categorySelect" required>
            <option value="">Select category</option>
            <option value="History">History</option>
            <option value="Science">Science</option>
            <option value="Technology">Technology</option>
            <option value="Art">Art</option>
            <option value="Other">Other</option>
        </select>

        <label for="commentsInput">Comments</label>
        <textarea
                id="commentsInput"
                rows="5"
                placeholder="Write your comments...">
            </textarea>

        <label>Grade</label>
        <div id="gradeStars" class="star-container">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>


        <div class="modal-buttons">
            <button type="button" id="cancelSave">Cancel</button>
            <button type="button" id="confirmSave">Save</button>
        </div>
    </div>
</div>

<div id="errorModal" class="modal hidden">
    <div class="modal-content error-modal">
        <h3>Error</h3>
        <p id="errorMessage"></p>
        <div class="modal-buttons">
            <button type="button" id="closeError">OK</button>
        </div>
    </div>
</div>

<script src="/js/search.js"></script>

</body>
</html>
